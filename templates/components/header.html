<header>
    <a href="/" class="logo-container" aria-label="Prahari Home / मुख्य पृष्ठ">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon-svg" style="fill: var(--accent-teal); width: 28px; height: 28px;" aria-hidden="true">
            <path d="M12 2S3 5 3 5v6c0 5.5 3.8 10.7 9 12c5.2-1.3 9-6.5 9-12V5s-9-3-9-3zm0 17.9c-2.9-.8-5-3.6-5-6.9V7.1l5-1.7 5 1.7v3.9c0 3.3-2.1 6.1-5 6.9z"/>
        </svg>
        <div class="logo-wordmark">
            <h1 style="color: var(--deep-navy);">Prahari</h1>
            <span class="logo-subtitle loc-en">Real Time Civic Intelligence & Response System</span>
            <span class="logo-subtitle loc-hi" lang="hi">तत्काल नागरिक सूचना एवं सहायता प्रणाली</span>
        </div>
    </a>
    <!-- Central Application Tabs/Navigation -->
    <nav class="header-nav" aria-label="Application Navigation">
        <a href="/" class="header-nav-link" id="nav-link-home">
            <span class="loc-en">Home</span>
            <span class="loc-hi" lang="hi">मुख्य पृष्ठ</span>
        </a>
        <a href="/submit/" class="header-nav-link" id="nav-link-submit">
            <span class="loc-en">Report an Incident</span>
            <span class="loc-hi" lang="hi">घटना रिपोर्ट</span>
        </a>
        <a href="/#track" class="header-nav-link" id="nav-link-track">
            <span class="loc-en">Track Report</span>
            <span class="loc-hi" lang="hi">रिपोर्ट ट्रैक</span>
        </a>
    </nav>
    <div class="nav-right">
        {% if not user.is_authenticated %}
        <a href="/login/" class="btn-coordinator" id="nav-coordinator-link">
            <span class="loc-en">Authorized Personnel</span>
            <span class="loc-hi" lang="hi">अधिकृत कर्मचारी</span>
        </a>
        {% endif %}
        {% block nav_links %}{% endblock %}
        <div class="lang-selector-bar" role="navigation" aria-label="Language Selector">
            <button type="button" class="lang-pill" data-lang="english" onclick="changeLanguage('english')" aria-label="Switch to English">English</button>
            <button type="button" class="lang-pill" data-lang="hindi" onclick="changeLanguage('hindi')" aria-label="Switch to Hindi / हिंदी में बदलें">हिंदी</button>
        </div>
        <select class="lang-selector-select" onchange="changeLanguage(this.value)" aria-label="Select Language / भाषा चुनें">
            <option value="english">English</option>
            <option value="hindi">हिंदी</option>
        </select>
    </div>
</header>
