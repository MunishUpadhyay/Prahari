{% extends "base.html" %}

{% block title %}Prahari — Coordinator Login{% endblock %}

{% block content %}
<main style="flex: 1; max-width: 420px; width: 100%; margin: 0 auto; padding: var(--space-7) 1.5rem; display: flex; flex-direction: column; justify-content: center;">
    <div class="surface-card" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div style="border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--space-3); display: flex; flex-direction: column; gap: 4px; text-align: left;">
            <span class="section-eyebrow">Personnel Portal</span>
            <h2 class="section-title loc-en">Coordinator Access</h2>
            <h2 class="section-title loc-hi" lang="hi">समन्वयक लॉगिन</h2>
            <p class="metadata-text loc-en">Authorized Prahari staff only.</p>
            <p class="metadata-text loc-hi" lang="hi">केवल अधिकृत प्रहरी कर्मी।</p>
        </div>

        <form method="POST" action="/login/">
            {% csrf_token %}

            {% if error %}
                <div class="form-error-label" style="margin-bottom: var(--space-4); font-weight: 600;">
                    {{ error }}
                </div>
            {% endif %}

            <div class="form-group" style="margin-bottom: var(--space-4); text-align: left;">
                <label class="form-label loc-en" for="username">Username</label>
                <label class="form-label loc-hi" lang="hi" for="username">उपयोगकर्ता नाम</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="text" name="username" id="username" class="form-control" required style="padding-left: 2.5rem;" placeholder="coordinator">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="position: absolute; left: 14px; color: var(--text-muted); pointer-events: none;" aria-hidden="true">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: var(--space-5); text-align: left;">
                <label class="form-label loc-en" for="password">Password</label>
                <label class="form-label loc-hi" lang="hi" for="password">पासवर्ड</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" name="password" id="password" class="form-control" required style="padding-left: 2.5rem;" placeholder="••••••••">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="position: absolute; left: 14px; color: var(--text-muted); pointer-events: none;" aria-hidden="true">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">
                <span class="loc-en">Login</span>
                <span class="loc-hi" lang="hi">लॉगिन</span>
            </button>
        </form>
    </div>
</main>
{% endblock %}
